# @package run
max_predictions: null
progress_log_every: 50
persist_predictions: true
transitive_grouping: true            # infer A~C from A~B and B~C, skipping its LLM request
resume: true                         # skip pairs already in the checkpoint store
checkpoint_dir: outputs/checkpoints  # directory holding warm-start checkpoints
max_consecutive_failures: 50         # circuit breaker; abort after this many failures in a row (<=0 disables)
