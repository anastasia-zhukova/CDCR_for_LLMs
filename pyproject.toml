[project]
name = "llm_ucdcr"
version = "0.1.0"
description = "Benchmarking LLMs out of the box on cross-document coreference resolution across the uCDCR datasets."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
authors = [{ name = "Sergei Zakharov" }]

dependencies = [
    "coval",
    "hydra-core>=1.3.2",
    "mlflow>=2.17.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.2.2",
    "seqeval>=1.2.2",
    "structlog>=25.5.0",
    "tiktoken>=0.8.0",
    "tqdm>=4.67.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.ruff]
fix = true
exclude = [
    ".git",
    ".ruff_cache",
    "venv",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "I",
    "EM",
    "FBT",
    "TRY003",
    "S101",
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "G004",
    "D107",
    "D211",
    "D213",
    "FA102",
    "FIX002",
    "TD002",
    "TD003",
    "S301",
    "N812", # There is a convention for some imports like functions being imported as F.
    "N803", # Names like X is expected to be uppercase by convention.
    "N806", # Names like X is expected to be uppercase by convention.
    "PLR0913",
    "ANN401",
    "TC003",
]

fixable = ["ALL"]
unfixable = ["F841"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"

[tool.uv.sources]
coval = { git = "https://github.com/ns-moosavi/coval.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
